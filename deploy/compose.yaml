# Overlay on the pinned NCDD topology. Its database is SQLite for this fork.
services:
  # This fork uses SQLite; do not start/publish the upstream SQL service.
  database:
    profiles: ["unused-database"]
    ports: !override []
  nextcloud:
    image: ${SOURCE_PHP_IMAGE:?Missing runtime .env}
    environment:
      XDEBUG_MODE: "off"
      NEXTCLOUD_HOST: ${SOURCE_PUBLIC_HOST}
      NEXTCLOUD_PROTOCOL: ${SOURCE_PROTOCOL}
    volumes:
      - ${SOURCE_RUNTIME_DIR}/cache/composer:/var/www/.composer
      - ${SOURCE_RUNTIME_DIR}/cache/npm:/var/www/.npm
  redis:
    image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
  nginx:
    image: ghcr.io/librecodecoop/nextcloud-dev-nginx@sha256:ecd9dc482b6c436e1757fd03c2e632dd32e5feee98678bf7a67bbe02e7f21b4b
    environment:
      VIRTUAL_HOST: ""
      SELF_SIGNED_HOST: ""
    depends_on: !override
      nextcloud:
        condition: service_started
    ports:
      - "${DEPLOY_HTTPS_BIND}:${DEPLOY_HTTPS_PORT}:443"
  mailpit:
    environment:
      VIRTUAL_HOST: ""
      SELF_SIGNED_HOST: ""
    ports:
      - "127.0.0.1:${DEPLOY_MAILPIT_PORT}:8025"
  # The upstream coordinator creates a shared proxy on fixed host ports 80/443.
  # Standalone deployments publish nginx directly and leave this profile inactive.
  proxy-coordinator:
    profiles: ["unused-shared-proxy"]
  cron:
    image: ${SOURCE_PHP_IMAGE}
    user: www-data
    working_dir: /var/www/html
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "while :; do php -f /var/www/html/cron.php; sleep 60; done"
    environment:
      PHP_INI_SCAN_DIR: /usr/local/etc/php/conf.d:/var/www/php-config
      XDEBUG_MODE: "off"
    volumes:
      - ${SOURCE_RUNTIME_DIR}/volumes/nextcloud:/var/www/html
      - ${SOURCE_RUNTIME_DIR}/volumes/php:/var/www/php-config:ro
      - ${LIBRESIGN_SOURCE_PATH}:/var/www/html/apps-extra/libresign:ro
    restart: unless-stopped
    depends_on:
      nextcloud:
        condition: service_started
